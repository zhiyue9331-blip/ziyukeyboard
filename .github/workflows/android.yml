name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test, lint, and assemble
        run: .\gradlew.bat --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Check public APK contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          $apk = [IO.Compression.ZipFile]::OpenRead('app/build/outputs/apk/debug/app-debug.apk')
          if ($apk.Entries.FullName -match 'star_bunny_skin') {
            throw 'Personal image skin must not be included in the PR APK.'
          }
          $apk.Dispose()

      - name: Upload public APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ziyu-0.4.14-no-skin
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
