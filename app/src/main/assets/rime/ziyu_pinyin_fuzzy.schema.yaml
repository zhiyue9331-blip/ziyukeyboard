schema:
  schema_id: ziyu_pinyin_fuzzy
  name: 字语拼音·模糊音
  version: "1.1"

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 英文]

engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    # qq marks a spelling that already changed once. Later rules skip it,
    # so can can become chan or cang, but not chang. qq is stripped before lookup.
    - derive/^([zcs])h(.+)$/$1$2qq/
    - derive/^([zcs])([^h].+)$/$1h$2qq/
    - derive/^n(.+)$/l$1qq/
    - derive/^l(.+)$/n$1qq/
    - derive/^hu$/fuqq/
    - derive/^fu$/huqq/
    # Marked spellings end in qq, so these end-anchored rules only see the original.
    - derive/([ei])n$/$1ngqq/
    - derive/([ei])ng$/$1nqq/
    - derive/ang$/anqq/
    - derive/an$/angqq/
    - xform/qq//
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/

translator:
  dictionary: pinyin_simp
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([jqxy])v/$1u/
