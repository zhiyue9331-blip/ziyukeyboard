schema:
  schema_id: ziyu_assembly
  name: 字语拼字
  version: "1.0"

switches:
  - name: ascii_mode
    reset: 0
    states: [拼字, 英文]

engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba

translator:
  dictionary: ziyu_assembly
  enable_user_dict: true
  enable_completion: true
  enable_sentence: false
